<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Family Style - Tacos</title>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: rgb(36, 26, 26);
    }

    .video-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 3px solid rgb(172, 147, 147);
      width: fit-content;
      margin-bottom: 50px;
      padding: 20px;
      border-radius: 12px;
      margin-left: 50%;
      transform: translateX(-50%);

    }

    .video-container a {
      margin-top: 25px;

    }

    h1 {
      color: white;
      align-self: center;
      justify-self: center;
      margin-top: 5vh;
      margin-bottom: 0;

    }


    h2 {
      color: white;
      align-self: center;
      justify-self: center;
      margin-top: 0;
      margin-bottom: 10vh;
    }


    .technology {
      display: flexbox;
      flex-direction: column;
      color: rgb(172, 147, 147);
      margin-left: 40%;
      transform: translateX(-50%);
      border: 3px solid rgb(172, 147, 147);
      width: fit-content;
      padding-right: 30px;
      padding-left: 30px;
      border-radius: 12px;
      ;

    }

    .structure-grid {
      display: grid;
      grid-template-columns: 60% 40%;
      grid-template-rows: auto;


    }

    .videosize {
      width: 900px;
      height: auto;
    }
  </style>
</head>

<body>

<html>
<body>
  <div class="page-container">
    <h1>Family Style</h1>
    <h2>Pork Chop</h2>
    <main class="wrap">
      <div class="structure-grid">
        <div class="video-container">
          <video id="myVideo" class="videosize" controls autoplay muted preload="metadata" playsinline poster="assets/poster.jpg">
            <source
              src="https://dl.dropboxusercontent.com/scl/fi/zlm9h3y2painszghthuw3/Tacos.m4v?rlkey=frwsvwmw12h138f3qgqcdm312&st=ihljdl22&dl=0" />
            Sorry — your browser can’t play this video.
          </video>
          <script>
              const video = document.getElementById('myVideo');

              // Set volume to 15% (0.15)
              video.volume = 0.15;

              // Pause immediately after load
              video.addEventListener('loadedmetadata', () => {
                video.pause();
              });
            </script>
          <a href="../index.html">Click to go back to main menu.</a>

        </div>


        <div class="technology">
          <h3> Technology Used:</h3>
          <ul>
            <li>Avid Media Composer (Offline)</li>
            
          </ul>
        </div>
      </div>


    </main>
  </div>

</body>
</html>
