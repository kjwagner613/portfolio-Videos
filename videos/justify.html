<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- <link rel="stylesheet" href="style.css"> -->
  <title>Animated Banner</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: rgb(36, 26, 26);
    }

    .video-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 3px solid rgb(172, 147, 147);
      width: fit-content;
      margin-bottom: 50px;
      padding: 20px;
      border-radius: 12px;
      margin-left: 50%;
      transform: translateX(-50%);

    }

    .video-container a {
      margin-top: 25px;

    }

    h1 {
      color: white;
      align-self: center;
      justify-self: center;
      margin-top: 5vh;
      margin-bottom: 0;

    }


    h2 {
      color: white;
      align-self: center;
      justify-self: center;
      margin-top: 0;
      margin-bottom: 10vh;
    }


    .technology {
      display: flexbox;
      flex-direction: column;
      color: rgb(172, 147, 147);
      margin-left: 40%;
      transform: translateX(-50%);
      border: 3px solid rgb(172, 147, 147);
      width: fit-content;
      padding-right: 30px;
      padding-left: 30px;
      border-radius: 12px;

    }

    body>div>main>div>div.nameblock>div.namecard>a {
      color: rgb(81, 143, 172);
      font-size: 1.3rem;
      text-indent: 20px;

    }

    .nameblock {
      position: absolute;
      left: 110px;
      right: 22px;
      bottom: 35px;

      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;

      font-size: 0.9rem;
      font-weight: 600;
      color: #111;
      width: 50vw;
    }

    .namecard,
    .emailcard {
      white-space: nowrap;

    }

    .structure-grid {
      display: grid;
      grid-template-columns: 60% 40%;
      grid-template-rows: auto;
    }

    .videosize {
      width: 900px;
      height: auto;
    }
  </style>
</head>

<body>

  <html>

  <body>
    <div class="page-container">
      <h1>FX Network</h1>
      <h2>Contraband</h2>
      <main class="wrap">
        <div class="structure-grid">
          <div class="video-container">
            <video id="myVideo" class="videosize" controls autoplay muted preload="metadata" playsinline
              poster="assets/poster.jpg">
              <source
                src="https://dl.dropboxusercontent.com/scl/fi/8wqccobe1wruqe6wg847t/JUST_S2_90_Theater.mov?rlkey=daehr82ga0098786fr5r1hol7&st=xt57pq5v&dl=0" />
              Sorry — your browser can’t play this video.
            </video>
            <script>
              const video = document.getElementById('myVideo');


              // Pause immediately after load
              video.addEventListener('loadedmetadata', () => {
                video.pause();
              });



              // Set volume to 15% (0.15)
              video.volume = 0.15;

              // Pause immediately after load
              video.addEventListener('loadedmetadata', () => {
                video.pause();
              });

              video.addEventListener('click', () => {
                try {
                  if (video.paused) {
                    // Play and unmute
                    video.muted = false;
                    video.play().catch(err => {
                      console.error("Playback failed:", err);
                    });
                  } else {
                    // Pause video
                    video.pause();
                  }
                } catch (err) {
                  console.error("Error handling video click:", err);
                }
              });
            </script>

          </div>


          <div class="technology">
            <h3> Technology Used:</h3>
            <ul>
              <li>Avid Media Composer (Offline)</li>

            </ul>
          </div>
          <div class="nameblock">
            <div class="namecard">
              <a href="../index.html">Click to go back to main menu.</a>
            </div>
            <div class="emailcard">
              <p style="color: rgb(173, 151, 151); font-size: 1.4rem;">Don't forget to turn up the volume.</p>
            </div>
          </div>

        </div>


      </main>
    </div>

  </body>

  </html>
